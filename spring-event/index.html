<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* ===== 1. 基本設定 ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang TC", "Noto Sans TC", sans-serif;
    background: #8a8a8a;              /* 模擬被遮罩蓋住的背景（預覽用） */
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* ===== 2. 彈窗本體 ===== */
  .modal {
    position: relative;
    width: 340px;
    background: #fbf3e4;
    border-radius: 8px;
    overflow: hidden;
    text-align: center;
  }

  /* ===== 3. 頂部插畫區 ===== */
  .banner-img {
    width: 100%;
    display: block;
  }

  /* ===== 4. 已完成今日簽到（一張圖 + 兩顆星星） =====
     .status-wrap：固定高度 92px，決定 DAY 那排的位置
     .status-box ：圖片 + 星星的外框，星星用「百分比」定位，
                   所以圖片放大縮小時，星星會跟著一起對位 */
  .status-wrap {
    position: relative;
    width: 100%;
    height: 92px;
  }
  .status-box {
    position: absolute;
    top: 19px;                       /* 圖片離橫幅下緣的距離 */
    left: 50%;
    width: 140px;                    /* 圖片寬度（想放大縮小改這裡） */
    margin-left: -81px;              /* = 寬度的一半，讓它置中 */
    opacity: 0;                      /* 動畫開始前先藏起來 */
    transform-origin: center center;
  }
  .status-img {
    display: block;
    width: 100%;
    height: auto;
  }

  /* 星星：大的在勾勾左上、小的在勾勾右下（依參考圖的比例） */
  .sparkle {
    position: absolute;
    height: auto;
    opacity: 0;
    pointer-events: none;
    transform-origin: center center;
  }
  .s-big   { width: 11.7%; left: 18.9%; top: 2%;    }   /* 左上・大 */
  .s-small { width: 8.7%;  left: 67.3%; top: 40.6%; }   /* 右下・小 */

  /* ===== 5. DAY1~8 進度條 ===== */
  .days {
    display: flex;
    justify-content: space-between;
    padding: 20px 24px 0;
    position: relative;
  }
  .days::before {                      /* 後面那條連接線 */
    content: "";
    position: absolute;
    left: 41px; right: 41px;
    top: 32px;
    height: 2px;
    background: #fbe9d8;
  }
  .day {
    position: relative;
    width: 34px;
    display: flex;
    flex-direction: column;
    align-items: center;
    white-space: nowrap;
    font-family: "M PLUS Rounded 1c", sans-serif;
    font-weight: 500;
    font-size: 8px;
    color: #882408;
  }
  .day .dot {
    position: relative;
    flex: 0 0 24px;
    width: 24px; height: 24px;
    margin-bottom: 4px;
    border-radius: 50%;
    background: #fbe9d8;
    color: #882408;
    font-size: 10px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .day.done .dot { background: #fbf3e4; }
  .day.gift .dot { background: transparent; }
  .day .dot img { width: 24px; height: 24px; display: block; }
  .day.milestone span { font-weight: 700; color: #882408; }

  /* ===== 6. 標語 ===== */
  .slogan {
    display: block;
    width: 230px;
    height: auto;
    margin: 16px auto 16px;
  }

  /* ===== 7. 好禮列 ===== */
  .reward {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 20px;
    margin: 0 0 14px;
  }
  .reward-title {
    display: block;
    width: 180px;
    height: auto;
  }
  .reward .state {
    font-family: "M PLUS Rounded 1c", sans-serif;
    font-weight: 500;
    line-height: 1.5;
    text-align: center;
  }
  .reward .state b {
    display: block;
    font-size: 10px;
    font-weight: 500;
    color: #53422B;
  }
  .reward .state span {
    display: block;
    font-size: 12px;
    color: #882408;
  }
  .reward .state.got span { color: #F86054; }

  /* ===== 8. 四角花紋、活動期間 ===== */
  .corner {
    position: absolute;
    width: 38px;
    pointer-events: none;
  }
  .corner.tl { top: 184px; left: 8px; }
  .corner.tr { top: 184px; right: 8px; transform: scaleX(-1); }
  .corner.bl { bottom: 10px; left: 8px; transform: scaleY(-1); }
  .corner.br { bottom: 10px; right: 8px; transform: scale(-1, -1); }
  .period {
    font-family: "M PLUS Rounded 1c", sans-serif;
    font-weight: 700;
    font-size: 8px;
    color: #53422B;
    text-align: center;
    margin: 16px 0 0;
    padding-bottom: 20px;
  }

  /* ===== 9. 已完成今日簽到動畫 =====
     圖片：0.3 秒開始，從中間由小變大，慢慢彈出（0.9 秒）
     星星：圖片出現後淡入，再像呼吸燈一樣慢慢亮暗（一輪 3.6 秒） */
  .ready .status-box {
    animation: statusPop 0.9s cubic-bezier(0.34, 1.3, 0.64, 1) 0.3s both;
  }
  @keyframes statusPop {
    from { opacity: 0; transform: scale(0.5); }
    to   { opacity: 1; transform: scale(1); }
  }

   /* 大星星：先淡入，再淡出 */
  .ready .s-big {
    animation:
      
      breathe 1.6s ease-in-out 0.9s infinite;
  }
  /* 小星星：晚 0.6 秒淡入，兩顆會自然錯開 */
  .ready .s-small {
    animation:
      
      breathe 2.6s ease-in-out 1.8s infinite;
  }
  @keyframes starIn {
    from { opacity: 0;   transform: scale(0.6); }
    to   { opacity: 0.3; transform: scale(0.85); }
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.3; transform: scale(0.85); }
    50%      { opacity: 1;   transform: scale(1.05); }
  }

  /* ===== 10. DAY 動畫（禮物打開 / 數字變勾勾） =====
     動畫中的每一張圖、數字，都用「絕對定位 + 固定 24×24」
     疊在圓圈同一個位置，所以切換時不會位移。 */
  .just-gift .dot,
  .just-day .dot { position: relative; }

  .just-gift .dot img,
  .just-day .dot img,
  .just-day .num-out {
    position: absolute;
    left: 0; top: 0;
    width: 24px; height: 24px;
    margin: 0;
    object-fit: contain;
    transform-origin: center center;
  }
  .just-day .num-out {
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  .just-gift .gift-open,
  .just-day .check-in { opacity: 0; }

  .ready .just-gift .gift-closed {
    animation: giftShake 0.7s ease-in-out 0.3s both;
  }
  .ready .just-gift .gift-open {
    animation: giftOpen 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.9s both;
  }
  .ready .just-day .num-out {
    animation: numVanish 0.7s ease-in-out 0.3s both;
  }
  .ready .just-day .check-in {
    animation: giftOpen 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.9s both;
  }

  @keyframes giftShake {
    0%   { transform: rotate(0); opacity: 1; }
    15%  { transform: rotate(-10deg); }
    30%  { transform: rotate(10deg); }
    45%  { transform: rotate(-8deg); }
    60%  { transform: rotate(8deg); opacity: 1; }
    80%  { transform: rotate(0); opacity: 1; }
    100% { transform: rotate(0); opacity: 0; }
  }
  @keyframes giftOpen {
    from { opacity: 0; transform: scale(0.7); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes numVanish {
    0%   { transform: rotate(0) scale(1); opacity: 1; }
    15%  { transform: rotate(-10deg); }
    30%  { transform: rotate(10deg); }
    45%  { transform: rotate(-8deg); }
    60%  { transform: rotate(8deg) scale(1); opacity: 1; }
    100% { transform: rotate(0) scale(0); opacity: 0; }
  }

  /* 系統設定「減少動態效果」：不播動畫，直接顯示結果 */
  @media (prefers-reduced-motion: reduce) {
    .status-box { opacity: 1; }
    .sparkle { opacity: 1; }
    .ready .status-box,
    .ready .sparkle { animation: none; }
    .just-gift .gift-closed,
    .just-day .num-out { display: none; }
    .just-gift .gift-open,
    .just-day .check-in { opacity: 1; }
    .ready .just-gift .gift-open,
    .ready .just-day .check-in { animation: none; }
  }
</style>
</head>
<body>

<div class="modal">
  <img class="corner tl" src="images/corner.png" alt="">
  <img class="corner tr" src="images/corner.png" alt="">
  <img class="corner bl" src="images/corner.png" alt="">
  <img class="corner br" src="images/corner.png" alt="">

  <img class="banner-img" src="images/banner.png" alt="">

  <div class="status-wrap">
    <div class="status-box">
      <img class="status-img" src="images/status_check.svg" alt="已完成今日簽到">
      <img class="sparkle s-big"   src="images/icon_sparkle.svg" alt="">
      <img class="sparkle s-small" src="images/icon_sparkle.svg" alt="">
    </div>
  </div>

  <div class="days" id="days"></div>

  <img class="slogan" src="images/text_slogan.png" alt="每天簽到不間斷，好禮拿不停！">

  <div class="reward">
    <img class="reward-title" src="images/img_reward_3day.png" alt="累積3日簽到 汽車30分鐘折抵券">
    <div class="state" id="state1">
      <b>好禮一</b>
      <span></span>
    </div>
  </div>
  <div class="reward">
    <img class="reward-title" src="images/img_reward_7day.png" alt="累積7日簽到 汽車120分鐘折抵券">
    <div class="state" id="state2">
      <b>好禮二</b>
      <span></span>
    </div>
  </div>

  <p class="period">活動期間：2027/02/03-2027/02/10</p>
</div>

<script>
  // ★ 已簽到幾天（只要改這個數字，1～8）
  const signedDays = 7;

  // ---------- 進度條 ----------
  const GIFTS = {
    3: { closed: "images/icon_gift_yellow.svg", open: "images/icon_gift_yellow_open.svg" },
    7: { closed: "images/icon_gift_red.svg",    open: "images/icon_gift_red_open.svg" }
  };

  let html = "";
  for (let day = 1; day <= 8; day++) {
    const gift = GIFTS[day];
    const done = day <= signedDays;
    let cls = "day";
    let inside = day;

    if (gift) {
      cls += " gift milestone";
      if (!done) {
        inside = '<img src="' + gift.closed + '" alt="">';
      } else if (day === signedDays) {
        // 今天剛解鎖：搖一搖 → 打開
        inside = '<img class="gift-closed" src="' + gift.closed + '" alt="">' +
                 '<img class="gift-open" src="' + gift.open + '" alt="">';
        cls += " just-gift";
      } else {
        inside = '<img src="' + gift.open + '" alt="">';
      }
    } else if (done) {
      if (day === signedDays) {
        // 今天剛簽到：數字消失 → 勾勾彈出
        inside = '<span class="num-out">' + day + '</span>' +
                 '<img class="check-in" src="images/icon_day_done.svg" alt="">';
        cls += " just-day";
      } else {
        cls += " done";
        inside = '<img src="images/icon_day_done.svg" alt="">';
      }
    }

    html += '<div class="' + cls + '"><div class="dot">' + inside + '</div><span>DAY ' + day + '</span></div>';
  }
  document.getElementById("days").innerHTML = html;

  // ---------- 好禮狀態 ----------
  const rewards = [
    { id: "state1", need: 3 },   // 好禮一：累積 3 天
    { id: "state2", need: 7 }    // 好禮二：累積 7 天
  ];
  rewards.forEach(function (r) {
    const box = document.getElementById(r.id);
    const got = signedDays >= r.need;
    box.classList.toggle("got", got);
    box.querySelector("span").textContent = got ? "已獲得" : "待完成";
  });

  // ---------- 依螢幕大小縮放整張卡片 ----------
  const REF_W = 375;
  const REF_H = 812;
  const MAX_SCALE = 1;

  function fitCard() {
    const card = document.querySelector(".modal");
    const w = document.documentElement.clientWidth;
    const h = document.documentElement.clientHeight;
    card.style.zoom = Math.min(w / REF_W, h / REF_H, MAX_SCALE);
  }
  fitCard();
  window.addEventListener("resize", fitCard);

  // ---------- 等載入完再播動畫（最多等 1.5 秒） ----------
  let played = false;
  function play() {
    if (played) return;
    played = true;
    document.body.classList.add("ready");
  }
  window.addEventListener("load", play);
  setTimeout(play, 1500);
</script>
</body>
</html>
